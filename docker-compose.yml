# Default CMD: python -m polymarket_copy_bot.activity_runner run --limit 50 (see Dockerfile). COPY_WALLET_* = proxyWallet for /activity.
# Position-sync only: command: ["python","-m","polymarket_copy_bot.cli","run"]
#
# Deploy: copy .env.example -> .env, fill secrets, then:
#   docker compose up -d --build
#
# State (watch cache, logs) persists in the named volume.

services:
  polymarket-copy-bot:
    build: .
    container_name: polymarket-copy-bot
    restart: unless-stopped
    environment:
      PM_HOST: ${PM_HOST:-https://clob.polymarket.com}
      PM_CHAIN_ID: ${PM_CHAIN_ID:-137}
      PM_PRIVATE_KEY: ${PM_PRIVATE_KEY:-}
      PM_FUNDER: ${PM_FUNDER:-}
      PM_SIGNATURE_TYPE: ${PM_SIGNATURE_TYPE:-1}
      PM_RELAYER_API_KEY: ${PM_RELAYER_API_KEY:-}
      PM_RELAYER_SECRET: ${PM_RELAYER_SECRET:-}
      PM_RELAYER_PASSPHRASE: ${PM_RELAYER_PASSPHRASE:-}
      PM_DATA_API_BASE: ${PM_DATA_API_BASE:-https://data-api.polymarket.com}
      PM_DATA_API_KEY: ${PM_DATA_API_KEY:-}
      COPY_WALLET_1: ${COPY_WALLET_1:-0xe055d214540ba6fde3c5c18adb7fed9c02630628}
      COPY_WALLET_2: ${COPY_WALLET_2:-}
      COPY_WALLET_3: ${COPY_WALLET_3:-}
      WATCHED_WALLETS: ${WATCHED_WALLETS:-}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-2}
      COPY_RATIO: ${COPY_RATIO:-1.0}
      BUY_SLIPPAGE_BPS: ${BUY_SLIPPAGE_BPS:-200}
      SELL_SLIPPAGE_BPS: ${SELL_SLIPPAGE_BPS:-200}
      MAX_SINGLE_ORDER_USD: ${MAX_SINGLE_ORDER_USD:-100.0}
      MAX_TOTAL_EXPOSURE_USD: ${MAX_TOTAL_EXPOSURE_USD:-1000.0}
      DRY_RUN: ${DRY_RUN:-true}
      STATE_DIR: ${STATE_DIR:-/app/state}
      WATCHLIST_FILE: ${WATCHLIST_FILE:-/app/state/watch_wallets.json}
      EXECUTION_LOG: ${EXECUTION_LOG:-/app/state/execution_log.json}
      ALLOWED_EVENT_SLUG_PREFIXES: ${ALLOWED_EVENT_SLUG_PREFIXES:-}
      BLOCKED_CONDITION_IDS: ${BLOCKED_CONDITION_IDS:-}
      BLOCKED_TOKEN_IDS: ${BLOCKED_TOKEN_IDS:-}
      EXCLUDE_ENDED_MARKETS: ${EXCLUDE_ENDED_MARKETS:-true}
      ACTIVITY_MAX_AGE_SECONDS: ${ACTIVITY_MAX_AGE_SECONDS:-90}
      ACTIVITY_SKIP_ENDED_TITLE_FILTER: ${ACTIVITY_SKIP_ENDED_TITLE_FILTER:-true}
      COPY_SOURCE_USDC_MULTIPLIER: ${COPY_SOURCE_USDC_MULTIPLIER:-0.05}
      MIN_COPY_USDC: ${MIN_COPY_USDC:-1}
      MIN_COPY_SHARES: ${MIN_COPY_SHARES:-5}
      MAX_COPY_USDC: ${MAX_COPY_USDC:-10}
      MAX_COPY_USDC_PER_WINDOW: ${MAX_COPY_USDC_PER_WINDOW:-25}
      MAX_COPY_USDC_PER_CYCLE: ${MAX_COPY_USDC_PER_CYCLE:-50}
      MAX_COPY_USDC_PER_DAY: ${MAX_COPY_USDC_PER_DAY:-150}
      MAX_COPY_ASK_PRICE: ${MAX_COPY_ASK_PRICE:-0.98}
      ACTIVITY_BUY_SLIPPAGE_BPS: ${ACTIVITY_BUY_SLIPPAGE_BPS:-150}
      BALANCE_REFRESH_SECONDS: ${BALANCE_REFRESH_SECONDS:-10}
      ACTIVITY_ALLOWED_ASSETS: ${ACTIVITY_ALLOWED_ASSETS:-btc,sol,bnb,eth}
      ACTIVITY_ALLOWED_TITLE_KEYWORDS: ${ACTIVITY_ALLOWED_TITLE_KEYWORDS:-}
      ACTIVITY_REQUIRED_WINDOW_MINUTES: ${ACTIVITY_REQUIRED_WINDOW_MINUTES:-5}
    volumes:
      - polymarket_state:/app/state

volumes:
  polymarket_state:
